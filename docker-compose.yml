services:
  web:
    build: .
    image: multimedios:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      STORE: sqlite
      DATABASE_PATH: /data/multimedios.sqlite
      #obligatorio
      SESSION_SECRET: ${SESSION_SECRET:?define SESSION_SECRET en .env (openssl rand -hex 32)}
      # opcional: para que /api/health muestre info
      TZ: America/Puerto_Rico
    volumes:
      - datos:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 10s

volumes:
  datos:
